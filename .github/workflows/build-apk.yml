name: Build SA-MP APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir source
          unzip -q SAMP-Mobile-GTA-2.11.zip -d source
          find source -maxdepth 2 -type f | head -50

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "ndk;26.2.11394342"

      - name: Find project
        run: |
          find source -name gradlew -type f

      - name: Build
        run: |
          PROJECT=$(dirname "$(find source -name gradlew -type f | head -1)")
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-2.11
          path: source/**/build/outputs/apk/**/*.apk
